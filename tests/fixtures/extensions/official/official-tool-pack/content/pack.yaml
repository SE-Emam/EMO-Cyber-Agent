pack:
  id: gitleaks-pack
  name: Gitleaks Tool Pack
  version: 1.0.0
  vendor: Gitleaks
  description: Read-only secret indicator detection over directories. Redaction is enforced before persistence and logging; raw secret material never crosses the evidence boundary. Upstream lifecycle is recorded as security-only pending confirmation against upstream documentation.
  tool_version_range: ">=1.0.0"
  maintenance_status: security_only
  license: MIT
  source_provenance: upstream release channel
  entrypoint: gitleaks
  supported_platforms: [linux, darwin]
  supported_targets: [repo]

definitions:
  - id: gitleaks-dir-scan
    tool_id: gitleaks
    tool_capability: scanner.local.execute
    mode: dir-scan
    version_range: ">=1.0.0"
    adapter: gitleaks
    capabilities: [SECRET_DETECTION, LOCAL_REPOSITORY_SCAN]
    inputs:
      fields: []
    outputs:
      record_kinds: [observation]
      retains_raw: false
      raw_limit: 4096
      redaction: true
    runtime:
      entrypoint: gitleaks
      timeout_s: 120
      stdout_limit: 65536
      stderr_limit: 16384
      cwd_scoped: true
      env_allowlist: []
    network: network_none
    supported_targets: [repo]
    snapshot_binding: false
    executable: true
    fixed_args: []
    value_flags: []

network:
  default: network_none

filesystem:
  read_only: true

resource_limits:
  max_stdout_bytes: 65536
  timeout_s: 120

secrets:
  handling: redact-and-never-persist
  redaction_rules: [credential-patterns, token-patterns, fingerprint-only]

evidence:
  mapping:
    observation: observation_to_evidence_fields

limitations:
  - Only fingerprint, rule, path, and line survive; secret values are dropped at parse time.
  - Upstream maintenance status is recorded as security-only; confirm against upstream documentation before relying on lifecycle claims.
  - Results are untrusted external data until normalized with provenance.

provenance: {source: official}
