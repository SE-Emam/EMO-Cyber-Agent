version: "1.0"
name: default-read-only
permission_profile: read_only

scope:
  allow_local_workspace: true
  allow_external_targets: false
  require_explicit_repository_authorization: true
  require_explicit_cloud_scope: true

content_handling:
  repository_content_is_untrusted: true
  tool_output_is_untrusted_data: true
  suppress_secret_values_in_reports: true

allowed_capabilities:
  - source_read
  - git_read
  - repository_metadata_read
  - security_findings_read
  - database_metadata_read
  - schema_read
  - rls_policy_read
  - auth_metadata_read
  - sast_scan
  - dependency_scan
  - secret_scan
  - configuration_scan
  - report_write_local

blocked_capabilities:
  - file_write
  - git_push
  - pr_merge
  - database_write
  - database_migration
  - resource_delete
  - unrestricted_shell
  - production_mutation

verification:
  enabled: false
  require_test_environment: true
  allow_destructive: false
