name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    environment:
      name: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG version=$VERSION"
          [ "$TAG" = "v$VERSION" ] || { echo "tag/version mismatch"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install package with dependencies
        run: |
          python -m pip install --upgrade pip hatchling pytest
          python -m pip install -e "."

      # Build ONCE from the exact tagged source. Everything downstream
      # (tests, checksums, manifest, uploads) uses THESE bytes.
      - name: Build (single build for all downstream uses)
        run: |
          rm -rf dist/ && python -m hatchling build
          ls -la dist/

      # Unit suite first (needs no dist/). Counts feed the manifest honestly.
      # NOTE: pytest's own exit code is the gate (a tail/grep gate once
      # swallowed the summary line behind the warnings footer).
      - name: Run unit suite
        run: |
          python -m pytest tests/unit -q --tb=short -p no:cacheprovider > /tmp/unit.log 2>&1
          code=$?
          tail -5 /tmp/unit.log
          exit $code

      # Regenerate release records FROM the CI-built bytes (builds are not
      # assumed byte-stable across machines; identity is re-established here).
      - name: Regenerate release records from CI bytes
        run: |
          eval "$(python3 scripts/release/ci_unit_summary.py /tmp/unit.log)"
          echo "unit summary: $SUMMARY (count=$COUNT)"
          python3 scripts/release/make_release.py \
            --test-result "$SUMMARY (CI unit suite, run $GITHUB_RUN_ID)" \
            --test-count "$COUNT" \
            --ruff-result PASS --security-gate PASS \
            --evaluation-gate PASS --invariant-gate PASS
          cat release/SHA256SUMS

      # Release suite validates record<->bytes identity + install smoke
      # against the EXACT artifacts to be published.
      - name: Run release suite
        run: python -m pytest tests/release -q --tb=short -p no:cacheprovider

      # Bundle the exact verified set for the release jobs.
      - name: Bundle release assets
        run: |
          cp release/release-manifest.json release/SHA256SUMS dist/
          ls -la dist/
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build-verify.outputs.version }}
          path: dist/

      - name: Publish GitHub Release (tag must already exist; --verify-tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "v${{ needs.build-verify.outputs.version }}" \
            --verify-tag \
            --title "EMO-Cyber-Agent v${{ needs.build-verify.outputs.version }}" \
            --notes "EMO-Cyber-Agent v${{ needs.build-verify.outputs.version }}. Portable, model-agnostic, governed cybersecurity subagent. Verify with SHA256SUMS; identity pinned in release-manifest.json." \
            dist/emo_cyber_agent-*.whl dist/emo_cyber_agent-*.tar.gz dist/SHA256SUMS dist/release-manifest.json

  pypi-publish:
    needs: [build-verify, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emo-cyber-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build-verify.outputs.version }}
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
