name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    environment:
      name: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG version=$VERSION"
          [ "$TAG" = "v$VERSION" ] || { echo "tag/version mismatch"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dependencies
        run: |
          python -m pip install --upgrade pip hatchling pytest
          python -m pip install -e "."

      - name: Run authoritative test suite
        run: python -m pytest -q --tb=short -p no:cacheprovider

      - name: Build (single build for all downstream uses)
        run: |
          rm -rf dist/ && python -m hatchling build
          ls -la dist/

      - name: Record checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build-verify.outputs.version }}
          path: dist/

      - name: Publish GitHub Release (tag must already exist; --verify-tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "v${{ needs.build-verify.outputs.version }}" \
            --verify-tag \
            --title "v${{ needs.build-verify.outputs.version }}" \
            --notes "EMO-Cyber-Agent v${{ needs.build-verify.outputs.version }}. See release-manifest.json and SHA256SUMS in the repository." \
            dist/*

  pypi-publish:
    needs: [build-verify, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emo-cyber-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build-verify.outputs.version }}
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
