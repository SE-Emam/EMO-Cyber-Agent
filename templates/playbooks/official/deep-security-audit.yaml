playbook:
  id: deep-security-audit
  title: Deep Security Audit
  version: 1.0.0
  type: security
  objective: Perform a full read-only security audit across code, authentication, authorization, dependencies, secrets, and data-access layers.
  description: Reference playbook. Sequential phases from reconnaissance to report. The reasoner may skip an irrelevant phase only with recorded evidence-backed reason.
tasks:
  required: [deep-security-audit, secret-audit, dependency-audit]
  optional: [threat-model]
skills:
  required: [authentication, authorization, secrets]
  optional: [cryptography, configuration]
tools:
  required: [semgrep]
  optional: [trivy, osv-scanner, gitleaks]
capabilities:
  requested: [repository.read, repository.list, repository.search, scanner.local.execute]
  denied: [repository.write, database.write, destructive]
execution:
  order: [deep-security-audit, secret-audit, dependency-audit]
  conditions: []
  max_tasks: 12
  max_iterations: 1
evidence:
  required: [repository_identity, file-evidence, tool-evidence]
  provenance_required: true
verification:
  required: true
  methods: [static_confirmation]
security:
  read_only_default: true
  forbidden_actions: [write, escalate, exfiltrate]
  external_targets: deny
  secrets_policy: strict
  untrusted_content: true
report:
  template: security-audit
stop_conditions: [policy_violation, scope_violation, evidence_integrity_failure, security_boundary_break, task_failure, budget_exhausted, no_progress, unresolved_critical_conflict]
acceptance_criteria:
  - All in-scope entry points inspected.
  - High-confidence candidates verified or marked needs-verification.
  - Limitations recorded in the report.
provenance: {source: official}
