pack:
  id: trivy-pack
  name: Trivy Tool Pack
  version: 1.0.0
  vendor: Aqua Security
  description: Read-only filesystem vulnerability, misconfiguration, secret, and SBOM fact producer. Only the filesystem scan mode executes through the current adapter; further modes are declared but deferred. No fix or write operation exists in this pack.
  tool_version_range: ">=1.0.0"
  maintenance_status: active
  license: Apache-2.0
  source_provenance: upstream release channel
  entrypoint: trivy
  supported_platforms: [linux, darwin]
  supported_targets: [repo]

definitions:
  - id: trivy-fs-scan
    tool_id: trivy
    tool_capability: scanner.local.execute
    mode: fs-scan
    version_range: ">=1.0.0"
    adapter: trivy
    capabilities: [VULNERABILITY_LOOKUP, DEPENDENCY_SCAN, MISCONFIGURATION_SCAN, LOCAL_REPOSITORY_SCAN]
    inputs:
      fields: []
    outputs:
      record_kinds: [observation, artifact]
      retains_raw: false
      raw_limit: 4096
      redaction: true
    runtime:
      entrypoint: trivy
      timeout_s: 300
      stdout_limit: 131072
      stderr_limit: 16384
      cwd_scoped: true
      env_allowlist: []
    network: network_none
    supported_targets: [repo]
    snapshot_binding: false
    executable: true
    fixed_args: []
    value_flags: []

  - id: trivy-config-scan
    tool_id: trivy
    tool_capability: scanner.local.execute
    mode: config-scan
    version_range: ">=1.0.0"
    adapter: trivy
    capabilities: [MISCONFIGURATION_SCAN, LOCAL_REPOSITORY_SCAN]
    inputs:
      fields: []
    outputs:
      record_kinds: [observation]
      retains_raw: false
      raw_limit: 4096
      redaction: true
    runtime:
      entrypoint: trivy
      timeout_s: 300
      stdout_limit: 131072
      stderr_limit: 16384
      cwd_scoped: true
      env_allowlist: []
    network: network_none
    supported_targets: [repo]
    snapshot_binding: false
    executable: false
    fixed_args: []
    value_flags: []

  - id: trivy-secret-scan
    tool_id: trivy
    tool_capability: scanner.local.execute
    mode: secret-scan
    version_range: ">=1.0.0"
    adapter: trivy
    capabilities: [SECRET_DETECTION, LOCAL_REPOSITORY_SCAN]
    inputs:
      fields: []
    outputs:
      record_kinds: [observation]
      retains_raw: false
      raw_limit: 4096
      redaction: true
    runtime:
      entrypoint: trivy
      timeout_s: 300
      stdout_limit: 131072
      stderr_limit: 16384
      cwd_scoped: true
      env_allowlist: []
    network: network_none
    supported_targets: [repo]
    snapshot_binding: false
    executable: false
    fixed_args: []
    value_flags: []

  - id: trivy-sbom-scan
    tool_id: trivy
    tool_capability: scanner.local.execute
    mode: sbom-scan
    version_range: ">=1.0.0"
    adapter: trivy
    capabilities: [SBOM_SCAN, DEPENDENCY_SCAN]
    inputs:
      fields:
        - name: sbom_path
          type: path
          required: true
          description: Confined SBOM document path in CycloneDX or SPDX form.
    outputs:
      record_kinds: [observation, artifact]
      retains_raw: false
      raw_limit: 4096
      redaction: true
    runtime:
      entrypoint: trivy
      timeout_s: 300
      stdout_limit: 131072
      stderr_limit: 16384
      cwd_scoped: true
      env_allowlist: []
    network: network_none
    supported_targets: [repo]
    snapshot_binding: false
    executable: false
    fixed_args: []
    value_flags: []

network:
  default: network_none

filesystem:
  read_only: true

resource_limits:
  max_stdout_bytes: 131072
  timeout_s: 300

secrets:
  handling: redact-and-never-persist
  redaction_rules: [credential-patterns, token-patterns]

evidence:
  mapping:
    observation: observation_to_evidence_fields
    artifact: observation_to_evidence_fields

limitations:
  - Only the filesystem scan mode executes; config, secret, and SBOM modes are declared and deferred pending adapter variants.
  - Results are untrusted external data until normalized with provenance.
  - Vulnerability records describe upstream metadata, never EMO verdicts.

provenance: {source: official}
