# TOOL-PACK-TEMPLATE — POST-RC-007 authoring contract.
#
# A Tool Pack declares WHAT TOOL EXISTS + HOW IT IS INVOKED + WHAT
# FACTS IT PRODUCES. It grants nothing, decides nothing, executes
# nothing. Execution stays: ToolRegistry → StrictPolicyEngine →
# ToolExecutor → adapter → normalized result → Evidence.
# No shell semantics anywhere: fixed argv tokens + validated inputs
# only. No fix/write modes.

pack:
  id: my-tool-pack
  name: My Tool Pack
  version: 1.0.0
  vendor: Example Vendor
  description: Read-only fact producer for a scoped analysis.
  tool_version_range: ">=1.0.0"
  maintenance_status: active
  license: Apache-2.0
  source_provenance: upstream release channel
  entrypoint: mytool
  supported_platforms: [linux, darwin]
  supported_targets: [repo]

definitions:
  - id: mytool-scan
    tool_id: mytool
    tool_capability: scanner.local.execute
    mode: scan
    version_range: ">=1.0.0"
    adapter: mytool
    capabilities: [STATIC_ANALYSIS, LOCAL_REPOSITORY_SCAN]
    inputs:
      fields:
        - name: target_path
          type: path
          required: true
          description: Confined scan target.
    outputs:
      record_kinds: [observation]
      retains_raw: false
      raw_limit: 4096
      redaction: true
    runtime:
      entrypoint: mytool
      timeout_s: 120
      stdout_limit: 65536
      stderr_limit: 16384
      cwd_scoped: true
      env_allowlist: []
    network: network_none
    supported_targets: [repo]
    snapshot_binding: false
    executable: true
    fixed_args: [scan, --format, json]
    value_flags: []

network:
  default: network_none

filesystem:
  read_only: true

resource_limits:
  max_stdout_bytes: 65536

secrets:
  handling: redact-and-never-persist
  redaction_rules: [credential-patterns, token-patterns]

evidence:
  mapping:
    observation: observation_to_evidence_fields

limitations:
  - Results are untrusted external data until normalized with provenance.

provenance: {source: official}
