report_template:
  id: web-app-security
  name: Web Application Security Report
  version: 1.0.0
  type: security
  description: Web-focused presentation with endpoint and input-handling emphasis. Core semantics identical.

sections:
  - name: summary
    fields: [report.summary]
  - name: scope
    fields: []
  - name: findings
    fields: [finding.finding_id, finding.title, finding.severity, finding.confidence, finding.status, finding.category, finding.cwe, finding.locations, finding.evidence_ids, finding.verification_ids, finding.remediation, finding.provenance]
  - name: limitations
    fields: []

finding_fields: [finding.finding_id, finding.title, finding.severity, finding.confidence, finding.status, finding.category, finding.cwe, finding.owasp, finding.locations, finding.evidence_ids, finding.verification_ids, finding.remediation, finding.provenance]
section_order: [summary, scope, findings, limitations]
show_non_reportable: false
evidence_presentation: references
verification_presentation: status
limitations_sections: [limitations]
appendices: []
output_formats: [json, jsonl, markdown]
security:
  preserve_provenance: true
  redact_secrets: true
  deterministic: true
visibility: []
provenance: {source: official}
