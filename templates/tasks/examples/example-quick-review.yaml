task:
  id: example-quick-review
  title: Example Quick Review
  version: 1.0.0
  type: review
  objective: Minimal example showing the canonical task shape.
scope:
  included: [repository]
  excluded: []
  target_types: [repo]
inputs:
  required: [source-tree]
  optional: []
skills:
  required: [code-review-security]
  optional: []
capabilities:
  required: [repository.read]
  denied: [repository.write, database.write, destructive]
tools:
  required: []
  optional: []
methodology:
  phases: [reconnaissance]
  procedures:
    - inventory targets
evidence:
  required: [repository_identity]
  provenance_required: true
  minimum_quality: sourced-with-locator
verification:
  required: false
  methods: []
  confirmation: ""
  refutation: ""
  stop_conditions: [scope-exhausted]
security_constraints:
  read_only_default: true
  forbidden_actions: [write]
  external_targets: deny
  secrets_policy: redact-and-never-persist
  untrusted_content: data-only
acceptance_criteria:
  - targets inventoried
deliverables: [observations]
report:
  template: security-audit
  required_sections: [summary]
provenance: {source: example}
