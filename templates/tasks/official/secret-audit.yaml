task:
  id: secret-audit
  title: Secret Audit
  version: 1.0.0
  type: audit
  objective: Detect secret indicators in tracked files by fingerprint only, never collecting values.
scope:
  included: [repository]
  excluded: [production]
  target_types: [repo]
inputs:
  required: [source-tree]
  optional: []
skills:
  required: [secrets]
  optional: [configuration]
capabilities:
  required: [repository.read, repository.list]
  denied: [repository.write, database.write, destructive]
tools:
  required: [gitleaks]
  optional: []
methodology:
  phases: [reconnaissance, secrets, verification]
  procedures:
    - scan tracked files for secret indicators
    - record fingerprints, never values
evidence:
  required: [repository_identity, fingerprint-evidence]
  provenance_required: true
  minimum_quality: sourced-with-locator
verification:
  required: true
  methods: [static_confirmation]
  confirmation: supporting-evidence-present
  refutation: contradicting-evidence-present
  stop_conditions: [scope-exhausted]
security_constraints:
  read_only_default: true
  forbidden_actions: [write, escalate, exfiltrate]
  external_targets: deny
  secrets_policy: redact-and-never-persist
  untrusted_content: data-only
acceptance_criteria:
  - indicators recorded by fingerprint without values
deliverables: [observations]
report:
  template: security-audit
  required_sections: [summary, findings, limitations]
provenance: {source: official}
