task:
  id: race-condition-review
  title: Race Condition Review
  version: 1.0.0
  type: review
  objective: Review shared-state writes for TOCTOU and idempotency gaps visible statically, read-only.
scope:
  included: [repository]
  excluded: [production]
  target_types: [repo]
inputs:
  required: [source-tree]
  optional: []
skills:
  required: [race-conditions]
  optional: [business-logic]
capabilities:
  required: [repository.read, repository.search]
  denied: [repository.write, database.write, destructive]
tools:
  required: [semgrep]
  optional: []
methodology:
  phases: [reconnaissance, business-logic, verification]
  procedures:
    - list shared-state writes
    - flag check-then-act patterns
evidence:
  required: [repository_identity, file-evidence]
  provenance_required: true
  minimum_quality: sourced-with-locator
verification:
  required: true
  methods: [static_confirmation]
  confirmation: supporting-evidence-present
  refutation: contradicting-evidence-present
  stop_conditions: [scope-exhausted]
security_constraints:
  read_only_default: true
  forbidden_actions: [write, escalate, exfiltrate]
  external_targets: deny
  secrets_policy: redact-and-never-persist
  untrusted_content: data-only
acceptance_criteria:
  - shared-state writes listed with evidence
deliverables: [observations]
report:
  template: security-audit
  required_sections: [summary, findings, limitations]
provenance: {source: official}
