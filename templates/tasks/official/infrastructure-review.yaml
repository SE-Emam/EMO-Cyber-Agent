task:
  id: infrastructure-review
  title: Infrastructure Security Review
  version: 1.0.0
  type: review
  objective: Review infrastructure-as-code for network, encryption, and access risks, read-only.
scope:
  included: [repository]
  excluded: [production]
  target_types: [repo]
inputs:
  required: [source-tree]
  optional: []
skills:
  required: [infrastructure-as-code, cloud-security, configuration]
  optional: []
capabilities:
  required: [repository.read, repository.list]
  denied: [repository.write, database.write, destructive]
tools:
  required: []
  optional: [semgrep]
methodology:
  phases: [reconnaissance, configuration, verification]
  procedures:
    - inventory IaC resources
    - record ingress, encryption, and access facts
evidence:
  required: [repository_identity, file-evidence]
  provenance_required: true
  minimum_quality: sourced-with-locator
verification:
  required: true
  methods: [configuration_confirmation]
  confirmation: supporting-evidence-present
  refutation: contradicting-evidence-present
  stop_conditions: [scope-exhausted]
security_constraints:
  read_only_default: true
  forbidden_actions: [write, escalate, exfiltrate]
  external_targets: deny
  secrets_policy: redact-and-never-persist
  untrusted_content: data-only
acceptance_criteria:
  - infrastructure resources inventoried with evidence
deliverables: [observations]
report:
  template: security-audit
  required_sections: [summary, findings, limitations]
provenance: {source: official}
